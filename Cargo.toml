[package]
name = "mlai-trade"
version = "2.0.1"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
brotli = "8"
bytes = "1"
flate2 = "1"
form_urlencoded = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hmac = "0.12"
http = "1"
quick-xml = "0.36"
regex = "1"
lightgbm3 = "1.0.10"
rayon = "1.10"
dirs = "6"
libc = "0.2"
quinn = { version = "0.11.9", default-features = false, features = [
    "runtime-tokio",
    "rustls-aws-lc-rs",
    "log",
    "bloom",
] }
rcgen = "0.14.7"
rustls = { version = "0.23.39", default-features = false, features = [
    "std",
    "aws_lc_rs",
    "prefer-post-quantum",
] }
rustls-pemfile = "2"
sha2 = "0.10"
time = "0.3"
tower-http = { version = "0.6", features = ["compression-full"] }
x509-parser = "0.18"
zstd = "0.13"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
xgboost_lib-sys = { version = "3.0.4", default-features = false }
openmp-sys = "1.3.0"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = "0.25.3"
mlx-macros = "0.25.3"

[target.'cfg(target_os = "linux")'.dependencies]
tch = { version = "0.24.0", features = ["download-libtorch"] }

[features]
default = ["xgboost-prebuilt"]
nvidia-cuda = ["xgboost-prebuilt", "lightgbm-cuda"]
lightgbm-cuda = ["lightgbm3/cuda"]
xgboost-local-cuda = ["xgboost_lib-sys/local_build", "xgboost_lib-sys/cuda"]
xgboost-prebuilt = ["xgboost_lib-sys/use_prebuilt_xgb"]
xgboost-baseline = []
mlx-lstm = []
tch-lstm = []

[profile.release]
opt-level = "s"
lto = true
strip = true
